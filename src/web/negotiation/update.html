<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商談情報入力</title>
    <!-- Bootstrap CSSの読み込み -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
    <h2 class="mb-4">商談情報を編集してください</h2>

<form id="negotiation-form">

    <div class="form-group">
        <label for="negotiationDate">商談日</label>
        <input type="date" class="form-control"
               id="negotiationDate"
               name="negotiationDate"
               required>
    </div>

    <div class="form-group">
        <label for="negotiationContent">商談内容</label>
        <textarea class="form-control"
                  id="negotiationContent"
                  name="negotiationContent"
                  rows="5"
                  required></textarea>
    </div>

    <div class="form-group">
        <label for="negotiationConfidence">商談確度</label>
        <input type="number"
               class="form-control"
               id="negotiationConfidence"
               name="negotiationConfidence"
               min="0"
               max="1"
               step="0.01"
               required>
    </div>

    <div class="form-group">
        <label for="negotiationRepresentative">担当者</label>
        <input type="text"
               class="form-control"
               id="negotiationRepresentative"
               name="negotiationRepresentative"
               required>
    </div>

    <button type="submit" class="btn btn-primary">更新</button>
    <button type="button" id="backBtn" class="btn btn-secondary">戻る</button>

</form>
    
    </div>
    <script type="module">
    import config from "../config.js";	    
    const params = new URLSearchParams(location.search);
const negotiationId = params.get("id");

fetch(`${config.apiUrl}/negotiation/${negotiationId}`)
    .then(response => response.json())
    .then(negotiationData => {
        document.getElementById("negotiationDate").value =
            negotiationData.negotiation_date.split("T")[0];

        document.getElementById("negotiationContent").value =
            negotiationData.negotiation_content;

        document.getElementById("negotiationConfidence").value =
            negotiationData.negotiation_confidence;

        document.getElementById("negotiationRepresentative").value =
            negotiationData.negotiation_representative;
    })
    .catch(error => {
        console.error(error);
        alert("商談情報の取得に失敗しました。");
    });

document.getElementById("negotiation-form")
    .addEventListener("submit", function(event) {
        event.preventDefault();

        const formData = new URLSearchParams(new FormData(this));

        fetch(`${config.apiUrl}/update-negotiation/${negotiationId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("商談情報を更新しました。");
                location.href = `./detail.html?id=${negotiationId}`;
            } else {
                alert("更新に失敗しました。");
            }
        })
        .catch(error => {
            console.error(error);
            alert("エラーが発生しました。");
        });
    });

document.getElementById("backBtn")
    .addEventListener("click", function() {
        location.href = `./detail.html?id=${negotiationId}`;
    });

    </script>
    <!-- BootstrapのJavaScriptの読み込み -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
