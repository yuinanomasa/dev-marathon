<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件情報入力</title>
    <!-- Bootstrap CSSの読み込み -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
    <h2 class="mb-4">商談情報を入力してください</h2>

<form id="negotiation-form">

    <div class="form-group">
        <label for="negotiationDate">商談日</label>
        <input type="date" class="form-control"
               id="negotiationDate"
               name="negotiationDate"
               required>
    </div>

    <div class="form-group">
        <label for="negotiationContent">商談内容</label>
        <textarea class="form-control"
                  id="negotiationContent"
                  name="negotiationContent"
                  rows="5"
                  required></textarea>
    </div>

    <div class="form-group">
        <label for="negotiationConfidence">商談確度</label>
        <input type="number"
               class="form-control"
               id="negotiationConfidence"
               name="negotiationConfidence"
               min="0"
               max="1"
               step="0.01"
               required>
    </div>

    <div class="form-group">
        <label for="negotiationRepresentative">担当者</label>
        <input type="text"
               class="form-control"
               id="negotiationRepresentative"
               name="negotiationRepresentative"
               required>
    </div>

    <button type="submit" class="btn btn-primary">確認画面へ</button>
    <button type="button" id="backBtn" class="btn btn-secondary">戻る</button>

</form>
    
    </div>
    <script type="module">
    const params = new URLSearchParams(location.search);
const caseId = params.get("caseId");

document.getElementById("negotiation-form")
    .addEventListener("submit", function(event) {
        event.preventDefault();

        const formData = new FormData(this);
        const confirmParams = new URLSearchParams(formData);

        confirmParams.append("caseId", caseId);

        location.href =
            "./add-confirm.html?" + confirmParams.toString();
    });

document.getElementById("backBtn")
    .addEventListener("click", function() {
        location.href = `../case/detail.html?id=${caseId}`;
    });

    </script>
    <!-- BootstrapのJavaScriptの読み込み -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
